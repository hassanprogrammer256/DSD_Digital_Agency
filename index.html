      content="DSD is a digital marketing agency in Dubai — SEO, paid advertising, social media, content marketing, web & app development, ecommerce, design, and AI-powered digital solutions."
    />
    <script>
      // Applies the stored/system theme before first paint so there is never a flash of
      // the wrong theme. Kept inline and dependency-free — src/theme/theme.ts re-derives
      // and owns this same logic for use after React mounts (e.g. the theme toggle).
      (function () {
        try {
          var stored = localStorage.getItem("dsd-theme");
          var mode = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
